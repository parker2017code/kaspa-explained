<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>verify harness</title>
<style>body{margin:0;font-family:sans-serif;background:#222;color:#fff}
.row{display:flex;gap:8px;padding:8px}
.cell{border:1px solid #555}
iframe{border:0;display:block}
h4{color:#fff;font-size:12px;margin:4px 8px}
</style></head>
<body>
<h4>390px dark</h4>
<div class="cell"><iframe id="f390d" src="/demos/attack-cost.html?bust=hv1" width="390" height="2200"></iframe></div>
<h4>390px light</h4>
<div class="cell"><iframe id="f390l" src="/demos/attack-cost.html?bust=hv2" width="390" height="2200"></iframe></div>
<h4>1280px dark</h4>
<div class="cell"><iframe id="f1280d" src="/demos/attack-cost.html?bust=hv3" width="1280" height="1400"></iframe></div>
<h4>1280px light</h4>
<div class="cell"><iframe id="f1280l" src="/demos/attack-cost.html?bust=hv4" width="1280" height="1400"></iframe></div>
<script>
try { localStorage.removeItem('kaspa-explained-theme'); } catch(e){}
function setLight(id){
  var f = document.getElementById(id);
  f.addEventListener('load', function(){
    try {
      f.contentDocument.documentElement.dataset.theme = 'light';
    } catch(e) { console.log('err', e); }
  });
}
setLight('f390l');
setLight('f1280l');
</script>
</body></html>
