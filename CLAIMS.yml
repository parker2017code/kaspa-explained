      the hash rate" section. Block reward 2.31246515 KAS (api.kaspa.org/info/blockreward), at 10
      blocks per second (Crescendo, block_time_s in data/l1-chains.json), gives 864,000 blocks/day
      and 1,997,970 KAS/day of subsidy. At $0.02934513/KAS (CoinGecko simple price, fetched live),
      that is about $58,631/day. Daily transactions 77,207 and median_fee_usd 0.000063, both from
      data/l1-chains.json's Kaspa entry, give daily fee revenue of about $4.86. Subsidy runs about
      12,054 times fee revenue; fees fund roughly 0.0083% of daily miner income. Hash rate 311.5
      PH/s (api.kaspa.org/info/hashrate, fetched live), consistent with l1-chains.json's
      hashrate_ehs of 0.31207 EH/s. Emission steps down 2^(-1/12) per month, about 5.61%, per
      rusty-kaspa's coinbase.rs SUBSIDY_BY_MONTH_TABLE (also cited in this file's
      emission_schedule_may_2026 claim); 12 monthly steps compound to exactly half, so holding KAS price flat the daily
      subsidy falls to about $29,315/day in one year and about $3,664/day in four years, still
      roughly 6,000x and 750x today's fee revenue respectively. Holding today's median fee flat,
      matching today's $58,631/day subsidy from fees alone needs about 10,771 tx/s sustained, a
      roughly 12,000x rise from Kaspa's own 0.895 tps sustained figure and above every chain's
      measured sustained rate in data/l1-chains.json, including Solana's 1,175. Holding today's
      77,207 tx/day flat, the same match needs a median fee near $0.76/tx, about 6x Bitcoin's own
      $0.1317 median (data/l1-chains.json). These are same-day snapshots multiplied through, not
      predictions: KAS price, hash rate, throughput, and fee levels all move independently, and
      price appreciation or throughput growth can each close part of the gap on their own.
    source: https://api.kaspa.org/info/blockreward

  chain_comparer_dial_corrections_2026_08_22:
    status: measurement_sensitive
    recheck_after: 2026-09-22
    summary: >
      Three chain-comparer.html/data/l1-chains.json dial fixes made 2026-08-22.
      (1) Finality dial: previously mixed kinds of number on one axis, scoring
      Bitcoin/Litecoin/Monero at their 6-confirmation custom conventions (3695s/904s/721s)
      and Bitcoin Cash not at all, while scoring Kaspa at its 10-second practical
      settlement convention rather than its coded rule, which let Kaspa's fast practical
      number outscore everyone's slow custom convention. Corrected: the dial now scores
      only a coded, consensus-enforced finality boundary. Bitcoin, Litecoin, Monero and
      Bitcoin Cash have no such rule in consensus (only the 6-confirmation custom), so
      finality_s is null for all four rather than substituted. Kaspa's finality_s is
      43,200 seconds (432,000 blocks at 10 blocks/second, rusty-kaspa params.rs
      finality_depth, 12 hours), reflecting GHOSTDAG, the consensus rule running on
      mainnet. DAGKnight (KIP-2, Status: Proposed) has no mainnet implementation and is
      not scored or added as a chain. Under the "Paying someone"
      default preset (fast 3, cheap 3, settle 2, ready 2), Kaspa moves from rank 7 of 18
      (score 70.2) to rank 13 of 18 (score 56.9 under the seven-dial presets in
      force when this entry was written; the presets now weight all ten dials, which
      puts Kaspa at 12 of 17, score 47); Kaspa's old 10-second figure had been
      the best number on that dial, and its true 12-hour figure is the worst number on
      that dial among all chains that publish one. (2) Hash-power dial: previously ranked
      Bitcoin (912.54 EH/s SHA-256), Bitcoin Cash (3.44 EH/s SHA-256), Litecoin (0.002479
      EH/s Scrypt), Kaspa (0.31207 EH/s kHeavyHash) and Monero (5.7e-9 EH/s RandomX) on one
      axis via a binary "Secured by mining" dial (pow=100, else 0), which credited every
      PoW chain identically regardless of actual spend and is the same unit-mismatch this
      site's own attack-cost demo already refuses to price across algorithms. Dropped and
      replaced with a "Pays for its own security" dial scored on emission_usd_per_day,
      which converts to dollars and is comparable across consensus families. Under
      the "Holding value" preset (spread 3, node 2, people 2,
      spend/mined 2), Kaspa moves from rank 4 of 18 (score 49.6, tied for the dial's
      maximum under the old binary credit) to rank 18 of 18, last (score 27.4 then,
      score 26 under the current ten-dial presets): Kaspa's
      $58,358/day security spend is the smallest of the five sourced proof-of-work chains.
      (3) Emission field added for both PoW and PoS chains, in native units and dollars,
      using the skeptical-case.html method: daily_native = block reward × blocks/day,
      daily_usd = daily_native × CoinGecko spot price fetched 2026-08-22. Sourced only for
      the five proof-of-work chains: Bitcoin 478.12 BTC/day ($36,841,653), Litecoin
      3,250.08 LTC/day ($168,289), Monero 431.25 XMR/day ($184,030), Bitcoin Cash 465.62
      BCH/day ($129,326), Kaspa 1,997,970 KAS/day ($58,358). That dollar figure uses a
      KAS price of $0.0292121; this file's fees_vs_subsidy_2026_08_22 claim states
      $58,631 from the same 1,997,970 KAS/day at $0.02934513. Both are CoinGecko
      snapshots taken on 2026-08-22 and they differ by 0.47 percent, a price move within
      the day, not a discrepancy in the issuance rate. Every proof-of-stake, BFT, federated and
      permissioned chain in the set (Ethereum, Solana, BNB Chain, Cardano, Avalanche,
      TRON, Sui, Aptos, TON, Near, Hedera, Algorand, Polkadot, Internet Computer, Stellar)
      is left unsourced rather than estimated and is excluded from the "Pays for its own
      security" dial rather than credited with zero. Ethereum specifically is not sourced
      because its net issuance is burn-adjusted under EIP-1559 and moves with fee demand,
      so there is no single native-per-day figure to quote without a netting calculation
      this pass did not do. Chain-comparer.html shows 20 chains; the attack-cost and
      node-cost demos show 5 (the chains each demo can price on its exact metric); the
      emission-schedule demo shows 1 (Kaspa only). This is a scope difference stated on
      chain-comparer.html, not an inconsistency to fix.
    source: https://github.com/kaspanet/rusty-kaspa/blob/master/consensus/core/src/config/params.rs
