  covenant_introspection_scope:
    status: research_direction
    recheck_after: 2026-09-21
    summary: >
      Kaspa covenant introspection is scoped to the spending transaction itself; there is no
      reference-input equivalent, so any covenant read of shared on-chain state (a price, a pool
      balance) consumes that state in the same transaction. Raised by Ross Ku in the Kaspa Core
      R&D Telegram group (t.me/kasparnd), Covenants topic, July 18, 2026, 17:40, while building a
      covenant DEX that needs a shared price board. He compared the gap to Cardano's CIP-31
      reference inputs and CIP-32 inline datums, Ergo's data inputs, and CKB's cell deps, and asked
      whether closing it needs a new KIP or belongs in L2/vProgs. Six reactions, no reply as of
      August 22, 2026. This is a Telegram report. It has not appeared as a kas-smiths.org forum
      post, and it is not independently confirmed beyond being raised and left unanswered. Attempted
      recheck August 24, 2026: t.me/kasparnd's public preview is reachable, but Telegram group message
      content is not readable without an authenticated Telegram client or bot token, neither available
      this pass, so whether a reply has since landed could not be independently reverified. Set a short
      interval given this gap; the next pass should get real Telegram access or confirm no forum
      cross-post has appeared on kas-smiths.org instead.
      Rechecked September 1, 2026, doing what that note asked. The kaspanet/kips README was re-read
      in full: 21 proposals, none addressing reference inputs, data inputs, or any read of shared
      on-chain state that does not consume it. KIP-17 (covenants and scripting) and KIP-20 (covenant
      IDs) are the closest and neither closes this. A kas-smiths.org search for the same terms
      returned no thread, so the forum cross-post the last pass looked for still does not exist.
      Telegram message content remains unreadable without an authenticated client, so whether Ross Ku
      ever got a reply is still unverified; that single gap is unchanged and is the whole reason this
      entry stays short-interval. The claim itself, that introspection is scoped to the spending
      transaction and no reference-input equivalent exists, is unchanged and now has a second
      independent negative check behind it.
    source: https://t.me/kasparnd
    forbidden_copy:
      - Kaspa covenants have a reference-input mechanism like Cardano or Ergo
      - the shared-state read gap has been answered with a KIP
      - the introspection gap was raised and resolved in Core R&D

  fees_vs_subsidy_2026_08_22:
    status: measurement_sensitive
    recheck_after: 2026-09-21
    summary: >
      Rechecked September 1, 2026: both inputs this entry rests on are unmoved. The block reward from
      api.kaspa.org/info/blockreward still reads 2.31246515 KAS, and data/l1-chains.json still carries
      meta.as_of 2026-08-22, so every figure derived below still matches its source. Nothing recomputed
      because nothing moved.
      Recomputed August 29, 2026 from data/l1-chains.json's Kaspa row (meta.as_of 2026-08-22),
      which is now the single source skeptical-case.html reads. The figures this entry carried
      before that date came from a superseded revision of the same file and no longer matched it:
      77,207 daily transactions against the file's 82,023, Solana's sustained 1,175 tx/s against
      2,032.805, and a Bitcoin median fee of $0.1317 against $0.054431. Those three are corrected
      below, and the page's demo now derives its copy from the same five fields rather than
      restating them by hand.
      Block reward 2.31246515 KAS (api.kaspa.org/info/blockreward), at 10 blocks per second
      (Crescendo, block_time_s in data/l1-chains.json), gives 864,000 blocks/day and 1,997,970
      KAS/day of subsidy, matching the file's emission_native_per_day. At $0.0292121/KAS, the
      CoinGecko price meta.caveats.emission names for that date, that is $58,357.75/day, the
      file's emission_usd_per_day. Daily transactions 82,023 and median_fee_usd 0.000063 give
      daily fee revenue of about $5.17. Subsidy runs about 11,293 times fee revenue; fees fund
      roughly 0.0089% of daily miner income.
      Emission steps down 2^(-1/12) per month, about 5.61%, per rusty-kaspa's coinbase.rs
      SUBSIDY_BY_MONTH_TABLE (also cited in this file's emission_schedule_may_2026 claim); 12
      monthly steps compound to exactly half, so holding KAS price flat the daily subsidy falls
      to about $29,179/day in one year and about $3,647/day in four.
      Holding today's median fee flat, matching today's subsidy from fees alone needs about
      926,313,492 transactions a day, 10,721 tx/s sustained: roughly 11,300 times Kaspa's own
      0.949 tx/s in the same file, 4.8 times its highest observed burst of 2,229.2, and 5.3 times
      Solana's 2,032.805, the highest sustained rate any chain in that file carries. Holding
      today's 82,023 tx/day flat instead, the same match needs a median fee near $0.7115, about 13
      times Bitcoin's own $0.054431 median in the same file.
      Two earlier notes kept for the record. An August 24 recheck against api.kaspa.org read the
      block reward unchanged at 2.31246515 KAS, still inside the 504,909,000-531,207,000 emission
      step, hash rate at 297,696.9 GH/s (about 0.2977 EH/s), and a CoinGecko price of
      $0.02864016/KAS. An earlier version of this entry priced the subsidy at $0.02934513/KAS for
      $58,631/day; that is a different same-day CoinGecko read from the one l1-chains.json used,
      0.47 percent apart, which is a price move inside the day rather than a disagreement about
      the issuance rate. The page uses the file's figure so the site has one home for it.
      These are same-day snapshots multiplied through, not predictions: KAS price, hash rate,
      throughput, and fee levels all move independently, and price appreciation or throughput
      growth can each close part of the gap on their own.
    source: https://api.kaspa.org/info/blockreward

  chain_comparer_dial_corrections_2026_08_22:
    status: measurement_sensitive
    recheck_after: 2026-09-22
    summary: >
      Three chain-comparer.html/data/l1-chains.json dial fixes made 2026-08-22.
      (1) Finality dial: previously mixed kinds of number on one axis, scoring
      Bitcoin/Litecoin/Monero at their 6-confirmation custom conventions (3695s/904s/721s)
      and Bitcoin Cash not at all, while scoring Kaspa at its 10-second practical
      settlement convention rather than its coded rule, which let Kaspa's fast practical
      number outscore everyone's slow custom convention. Corrected: the dial now scores
      only a coded, consensus-enforced finality boundary. Bitcoin, Litecoin, Monero and
      Bitcoin Cash have no such rule in consensus (only the 6-confirmation custom), so
      finality_s is null for all four rather than substituted. Kaspa's finality_s is
      43,200 seconds (432,000 blocks at 10 blocks/second, rusty-kaspa params.rs
      finality_depth, 12 hours), reflecting GHOSTDAG, the consensus rule running on
      mainnet. DAGKnight (KIP-2, Status: Proposed) has no mainnet implementation and is
      not scored or added as a chain. Under the "Paying someone"
      default preset (fast 3, cheap 3, settle 2, ready 2), Kaspa moves from rank 7 of 18
      (score 70.2) to rank 13 of 18 (score 56.9 under the seven-dial presets in
      force when this entry was written; the presets now weight all ten dials, which
      puts Kaspa at 12 of 17, score 47); Kaspa's old 10-second figure had been
      the best number on that dial, and its true 12-hour figure is the worst number on
      that dial among all chains that publish one. (2) Hash-power dial: previously ranked
      Bitcoin (912.54 EH/s SHA-256), Bitcoin Cash (3.44 EH/s SHA-256), Litecoin (0.002479
      EH/s Scrypt), Kaspa (0.31207 EH/s kHeavyHash) and Monero (5.7e-9 EH/s RandomX) on one
      axis via a binary "Secured by mining" dial (pow=100, else 0), which credited every
      PoW chain identically regardless of actual spend and is the same unit-mismatch this
      site's own attack-cost demo already refuses to price across algorithms. Dropped and
      replaced with a "Pays for its own security" dial scored on emission_usd_per_day,
      which converts to dollars and is comparable across consensus families. Under
      the "Holding value" preset (spread 3, node 2, people 2,
      spend/mined 2), Kaspa moves from rank 4 of 18 (score 49.6, tied for the dial's
      maximum under the old binary credit) to rank 18 of 18, last (score 27.4 then,
      score 26 under the current ten-dial presets): Kaspa's
      $58,358/day security spend is the smallest of the five sourced proof-of-work chains.
      (3) Emission field added for both PoW and PoS chains, in native units and dollars,
      using the skeptical-case.html method: daily_native = block reward × blocks/day,
      daily_usd = daily_native × CoinGecko spot price fetched 2026-08-22. Sourced only for
      the five proof-of-work chains: Bitcoin 478.12 BTC/day ($36,841,653), Litecoin
      3,250.08 LTC/day ($168,289), Monero 431.25 XMR/day ($184,030), Bitcoin Cash 465.62
      BCH/day ($129,326), Kaspa 1,997,970 KAS/day ($58,358). That dollar figure uses a
      KAS price of $0.0292121; this file's fees_vs_subsidy_2026_08_22 claim states
      $58,631 from the same 1,997,970 KAS/day at $0.02934513. Both are CoinGecko
      snapshots taken on 2026-08-22 and they differ by 0.47 percent, a price move within
      the day, not a discrepancy in the issuance rate. Every proof-of-stake, BFT, federated and
      permissioned chain in the set (Ethereum, Solana, BNB Chain, Cardano, Avalanche,
      TRON, Sui, Aptos, TON, Near, Hedera, Algorand, Polkadot, Internet Computer, Stellar)
      is left unsourced rather than estimated and is excluded from the "Pays for its own
      security" dial rather than credited with zero. Ethereum specifically is not sourced
      because its net issuance is burn-adjusted under EIP-1559 and moves with fee demand,
      so there is no single native-per-day figure to quote without a netting calculation
      this pass did not do. Chain-comparer.html shows 20 chains; the attack-cost and
      node-cost demos show 5 (the chains each demo can price on its exact metric); the
      emission-schedule demo shows 1 (Kaspa only). This is a scope difference stated on
      chain-comparer.html, not an inconsistency to fix.
    source: https://github.com/kaspanet/rusty-kaspa/blob/master/consensus/core/src/config/params.rs
