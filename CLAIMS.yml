claims:
  proof_of_work:
    status: live
    summary: Kaspa is mined Proof of Work.
    source: https://github.com/kaspanet/rusty-kaspa
  utxo:
    status: live
    summary: Kaspa uses a UTXO model; Ethereum uses an account model.
    source: https://github.com/kaspanet/rusty-kaspa
  ghostdag:
    status: live
    summary: GHOSTDAG is Kaspa's live blockDAG ordering rule.
    source: https://research.kas.pa/
  crescendo_10_bps:
    status: live
    summary: Kaspa's Crescendo-era 10 BPS network is live; Michael Sutton framed throughput as roughly 8-9x higher and confirmation-time improvement around 30%. Instant-finality claims and clean 10x confirmation-improvement claims overstate the source.
    source: https://github.com/kaspanet/rusty-kaspa/releases
    forbidden_copy:
      - 10 BPS gives automatic 10x finality
      - Kaspa mainnet payments are instantly final
  l1_status_snapshot_2026_08_08:
    status: measurement_sensitive
    recheck_after: 2026-08-18
    summary: >
      An August 8, 2026 L1 status check showed the public Kaspa REST API on kaspa-mainnet answered by a
      synced v2.0.1 node, virtual DAA score 507,631,731 (above the Toccata activation score), a 2.31246515
      KAS block reward under the current emission step, and about 27.627 billion KAS from the public
      supply endpoint. These are time-stamped network readings. They are unsuitable as timeless constants.
      Do not quote blockCount or headerCount from this endpoint: it load-balances across backend nodes
      with different pruning states, and two reads a minute apart returned 1,488,846 and 26,573,222.
    source: https://api.kaspa.org/info/blockdag
    forbidden_copy:
      - August 8 snapshot values are permanent
      - api.kaspa.org blockCount is a network-wide block total
      - A public REST API reading is stronger than node or release evidence
  emission_schedule_may_2026:
    status: live_design
    summary: >
      Kaspa's emission steps down every 2,629,800 seconds by a factor of 2^(-1/12), about 5.61% per step,
      426 steps deep in the consensus SUBSIDY_BY_MONTH_TABLE. Steps are triggered by DAA score, which is
      exact; calendar dates drift and should be marked approximate. Triggers and rates verified against
      coinbase.rs table indexes 48 through 52, which are 26,298,000 DAA apart at 10 BPS: 27.5 KAS/sec at
      DAA 426,015,000; 25.95654359 at 452,313,000; 24.49971474 at 478,611,000; 23.12465141 at 504,909,000,
      which the network passed around August 5, 2026 and which is current as of August 8, 2026;
      21.82676446 at 531,207,000, roughly September 4, 2026. At 10 BPS the current per-block subsidy is
      2.31246515 KAS, matching the block reward API. No month is a cliff.
    source: https://wiki.kaspa.org/en/tokenomics
    forbidden_copy:
      - Kaspa has a July 2026 emission cliff
      - July 2026 suddenly stops Kaspa issuance
      - the emission rate is 24.49971475 KAS per second
      - the current emission rate is 24.49971474 KAS per second
      - emission steps are anchored to calendar dates rather than DAA score
  tps_and_speed_context:
    status: measurement_sensitive
    recheck_after: 2026-08-25
    summary: TPS, throughput, and speed claims need measurement context. Current simple-payment capacity can be described as a rough 2.5k-3.4k TPS range at 10 BPS under transaction-shape assumptions. Covenant apps, ZK proof settlements, tokens, and future vProg-style app throughput need separate workload labels before repeating a number as normal mainnet behavior.
    source: https://github.com/kaspanet/rusty-kaspa/blob/master/consensus/core/src/config/params.rs
    supporting_source: https://github.com/kaspanet/rusty-kaspa/blob/master/consensus/core/src/mass/mod.rs
    site_context: https://kaspaexplained.com/kaspa-tps-explained
    forbidden_copy:
      - testnet TPS is mainnet TPS
      - lab TPS is normal mainnet use
      - real-time means instant irreversibility
      - Kaspa currently does 30k TPS
      - Toccata doubles TPS
      - ZK makes TPS unlimited
  base_rtd:
    status: live_framing
    summary: Kaspa.org now frames real-time decentralization as Kaspa's north star; Hashdag frames RTD first as Kaspa's real-time Bitcoin-style PoW value proposition.
    source: https://kaspa.org/lore
  fair_launch_origin:
    status: narrative_guardrail
    summary: >
      Kaspa's fair-launch origin should be described as source-backed history: PHANTOM/GHOSTDAG research,
      DAGLabs-era commercialization attempts, Polychain/Accomplice-era VC funding, an April 2021 testnet,
      failed hardware/presale paths, a messy gamenet-to-mainnet path, and a November 2021 proof-of-work
      launch with no premine, insider allocation, or pre-sales. The Kaspa Wiki prehistory page estimates
      the post-launch DAGLabs/Polychain-related early-miner amount at under 3% of supply, 840 million KAS,
      with its longer note saying probably closer to 2.5% and under 850 million KAS. Use this as an
      early-miner estimate. Premine claims and exact official allocation tables need different evidence.
      Fair launch lowers official allocation risk; it does not mean no early core contributors mined, and
      it does not prove perfect distribution, adoption, price, or future execution.
    source: https://kaspaexplained.com/kaspa-origin-story
    forbidden_copy:
      - DAGLabs and Polychain had a premine
      - Polychain background is irrelevant to Kaspa's launch story
      - Fair launch means no early insiders mined
      - Fair launch proves perfect distribution
  original_kaspad_codebase:
    status: narrative_guardrail
    summary: The safest public wording for the original implementation is that Kaspad was written in Golang and described by Yonatan Sompolinsky's Hashdag archive as an adaptation of the Bitcoin client btcd. Do not state a specific Bitcoin Core version unless a stronger source is added.
    source: https://hashd.ag/raw
  adoption_strategy:
    status: narrative_guardrail
    summary: Fast money and Base of Liquidity language are thesis framing. An adoption plan needs products, users, liquidity, integrations, and repeated behavior. Generic merchant/POS payments should not be treated as the whole 2026 adoption vector; evaluate useful products, visible on-chain activity, liquidity, coordination-market direction, and durable app usage.
    source: https://x.com/DailyKaspa/status/2052716697262374936
    forbidden_copy:
      - Base of Liquidity is Kaspa's adoption plan
      - Generic merchant payments are Kaspa's killer app
      - Fast payments alone prove adoption
  coordination_markets:
    status: research_direction
    recheck_after: 2026-09-01
    summary: Coordination markets are a highlighted Kaspa product direction in current narrative context, but production systems still need concrete commitment, oracle, settlement, privacy, liquidity, and app-rail designs before being described as live.
    source: https://x.com/DailyKaspa/status/2052716697262374936
    forbidden_copy:
      - Coordination markets are live on Kaspa
      - Staghunt is production-ready on Kaspa
  app_project_claims:
    status: builder_guardrail
    recheck_after: 2026-08-29
    summary: App/project claims are not L1 protocol-status evidence. Igra/Kaskad-style L2 or ecosystem app launches can be useful ecosystem context, but they do not prove native Kaspa L1 smart contracts, Toccata mainnet activation, or mature Kaspa-native DeFi. Mention app projects only when the L1 fact itself matters, such as transaction payload behavior, accepted transaction evidence, or fees paid to miners. Otherwise, leave them out.
    source: https://docs.kaspa.org/integrate/transaction-payload
    forbidden_copy:
      - App activity proves Toccata is live
      - Project tooling proves native Kaspa smart contracts are live
      - A wallet or frontend feature is protocol activation evidence
  toccata:
    status: daa_gated
    recheck_after: 2026-08-24
    summary: >
      Rusty Kaspa v2.0.1 was published on June 15, 2026 as the current Toccata release. Rusty Kaspa v2.0.0
      was published on June 5, 2026 as the Mainnet Toccata Release; it set Toccata mainnet activation for
      DAA score 474,165,565, roughly June 30, 2026 at 16:15 UTC, and says nodes switch peer compatibility
      behavior 24 hours before the activation score. Toccata activated. After the score, check
      upgraded-node behavior, transaction version 1 handling, covenant data, ZK proof paths, wallets,
      explorers, SDKs, examples, and accepted mainnet transactions. TN10/TN12 and KIP evidence remain
      useful testnet/design evidence. On July 15, 2026 the four Toccata KIPs (16, 17, 20, 21) were
      promoted together to Status: Active in kips commit e4ae2332, replacing their earlier TN10-scoped
      status; this is the spec repo catching up to activation, not a new protocol change. Transaction
      version 1 and computeBudget run on mainnet and are documented in the operator guide, but their specs
      (KIP-24 PR #41 and KIP-25 PR #42) are still open, so cite the guide or the node rather than a merged
      KIP number. No rusty-kaspa release exists after v2.0.1 (June 15, 2026).
    source: https://github.com/kaspanet/rusty-kaspa/releases/tag/v2.0.0
    supporting_source: https://github.com/kaspanet/rusty-kaspa/releases/tag/v2.0.1
    forbidden_copy:
      - Toccata is still pending
      - Toccata is scheduled to activate
      - Toccata will activate
      - Toccata is targeted
      - TN12 covenant evidence proves mainnet activation
      - TN10 activation proves mainnet activation
      - tn10-toc2 is a mainnet release
      - merged TN10 KIPs prove mainnet activation
  toccata_operator_readiness:
    status: daa_gated
    recheck_after: 2026-08-26
    summary: The Rusty Kaspa Toccata node setup guide says node operators should run v2.0.1 or newer; the node database upgrade is one-way without resync; direct RPC transaction submission uses the standard-fee floor of 100 sompi times max(compute grams, 2 * transaction bytes); new integrations should use storageMass/storage_mass plus transaction version 1, computeBudget, covenant outputs, and UTXO covenant_id where relevant; exchanges, pools, miners, wallets, explorers, and indexers should test against Testnet-10 and mainnet behavior after activation.
    source: https://github.com/kaspanet/rusty-kaspa/blob/master/docs/toccata-guide.md
    supporting_source: https://github.com/kaspanet/kaspad/releases/tag/v0.12.23
    forbidden_copy:
      - Operator upgrade guidance proves Toccata is already live
      - The standard fee floor is a consensus rule
      - Ordinary users must run a node before the activation score
  tn10_toccata_activation_test:
    status: testnet_only
    recheck_after: 2026-09-04
    summary: Rusty Kaspa's tn10-toc2 pre-release scheduled the first Toccata hard-fork activation point on Testnet-10 for May 18, 2026 at 16:00 UTC, DAA score 467,579,632. The tn10-toc3 pre-release scheduled final Toccata ZK hardening on Testnet-10 for May 28, 2026 around 16:00 UTC, DAA score 476,232,000. A July 25, 2026 check of the Testnet-10 REST API showed virtual DAA 526,066,399, well above the scheduled scores. This is testnet evidence for the activation path and node behavior. Mainnet activation needs separate mainnet evidence.
    source: https://github.com/kaspanet/rusty-kaspa/releases/tag/tn10-toc3
    forbidden_copy:
      - TN10 activation proves mainnet activation
      - Testnet-10 Toccata means mainnet Toccata is live
      - tn10-toc2 is a mainnet release
      - tn10-toc3 is a mainnet release
      - TN10 passed the activation score, so Toccata is live on mainnet
  tn12_covenant_evidence:
    status: testnet_only
    recheck_after: 2026-08-27
    summary: >
      The TN12 covenant lab has accepted proof transactions for vault recovery,
      vault delayed withdrawal, assurance release/refund, escrow release/refund/cancel,
      role-separated positive paths (all 7), batch-assurance 3-pledge release, and
      40 payload events, including scheduler-intent, scheduler-bid, scheduler-execution, and scheduler-covenant-binding receipts, plus accepted playground role-wallet funding, two user-to-pool deposits, and one pool-to-user payout. The public results and playground pages explain the evidence and role flow without upgrading it into mainnet or production custody. Adversarial rejection evidence covers 13 cases across 5 mutation
      types (wrong-signer, wrong-selector, wrong-output-lock, wrong-output-amount,
      single-party-cancel) confirmed rejected by the TN12 node with script-level errors.
      All evidence is limited to TN12/Toccata lane testing. Mainnet status needs separate mainnet evidence.
    source: https://github.com/parker2017code/tn12-covenant-vault-demo
    forbidden_copy:
      - TN12 proofs mean covenants are live on mainnet
      - Adversarial rejections prove mainnet covenant enforcement
      - TN12 txids are mainnet txids
  vprogs:
    status: roadmap
    recheck_after: 2026-09-03
    summary: >
      vProgs are roadmap architecture for apps that prove richer logic while sharing Kaspa ordering,
      including later cross-app atomic composition. They are not a mature live app ecosystem. The public
      vprogs repo README opens with "This repository is in early development / prototype phase. APIs and
      architecture may change significantly," and the workspace carries core, storage, state, scheduling,
      transaction-runtime, node, l1, zk, sim, runner, and examples members. Checked August 14, 2026: no
      change since the August 7 check. Still 19 commits landed in July 2026, the last on July 28 adding a
      program-agnostic daemon engine and a vprun CLI. Nothing has landed since, now over two weeks, and
      there are still zero releases, zero tags, and nothing on crates.io. Do not call the work pre-testnet.
      examples/tn10-flow describes itself as "a proof-of-concept that runs the L2 flow against a remote
      testnet-10 fork node," which is a custom fork node rather than the public Testnet-10, and settlement
      against the real OP_ZK_PRECOMPILE needs GPU proving rather than the dev stub receipts the default
      path emits. Its README says based computation while the GitHub description field says provable
      computation.
    source: https://github.com/kaspanet/vprogs
    forbidden_copy:
      - vProgs are live
  argent:
    status: research
    recheck_after: 2026-08-30
    summary: >
      Argent is an actor-based language and compiler for stateful multi-contract applications on
      covenant-native UTXO rails, compiling .ag source to plain Silverscript contracts and portable
      artifacts consumed by argent-runtime. The README's Project status section has two halves, and
      quoting only the first one misdescribes the project. The caution reads "The project is still under
      active development and is not yet release-ready," a careful early-production path opens only "Once
      Silverscript completes its audit and is released," and Argent itself "will still need further audit
      and hardening before general production use." The half that gets dropped reads "The main pieces are
      present: compiler, generated Silverscript, portable artifacts, runtime transaction building,
      multi-actor routing, cross-app linking, constrained covenant spawning, actor enums, closed and open
      ICC, and virtual-slot state expansion." A separate Current status section lists what is useful today
      (compiling .ag apps to auditable .sil, building tracked example transactions through argent-runtime,
      closed and open ICC examples, route-family and actor-enum examples, virtual-slot expanded state)
      apart from what is still being built (launch and bootstrap tooling, package and dependency tooling,
      diagnostics and typechecking, generated app-specific builder APIs, hardening and negative-test
      coverage). The gate is an audit, not a missing compiler. Checked August 14, 2026: no change to the
      README text since the August 7 check, and the repo has gone quiet since its last commit on August 2.
      The project has its own argent-lang organization, and github.com/michaelsutton/argent returns HTTP
      301 to github.com/argent-lang/argent. Three repos, all ISC licensed: argent (created June 16, 77
      commits with 58 of them in July and one on August 2 hardening entry arguments against route-state
      override, still the latest push), argent-playground (created July 9, multi-actor and DEX demos, still
      latest July 29), and argent-template (created July 24, still latest July 29). Sutton has 73 of
      argent's 77 commits; a19q3, Manyfestation, and WolfieOC hold the other four. Zero releases and zero
      tags on every repo. The audit gate is independently visible upstream: kaspanet/silverscript also has
      zero releases and zero tags, and stayed active through the check window (a security policy added
      August 11, compilation hardening August 10, entrypoint-argument and bounded-loop work August 10), so
      the release Argent waits on still has not happened. The template's Scope section says it "does not
      connect to a Kaspa network, manage a wallet, or submit transactions," and its VS Code extension for
      .ag files is linked out of the Argent checkout rather than shipped by the template. An
      examples/icc/kcc20_asset.ag file prototypes a KCC-0020-style transferable asset covenant whose owner
      identifier can be a pubkey or a covenant ID.
    source: https://raw.githubusercontent.com/argent-lang/argent/master/README.md
    supporting_source: https://github.com/argent-lang/argent
    forbidden_copy:
      - Argent proves production Kaspa smart contracts are ready
      - Argent applications run on Kaspa mainnet
      - unfinished prototype
      - Argent has no transaction builder
      - Argent's compiler is incomplete

  cross_app_composition:
    status: roadmap
    recheck_after: 2026-09-05
    summary: >
      Atomic composition means several app states succeed or fail as one operation. Composing separately
      compiled covenant apps atomically inside a single transaction is possible on Toccata itself:
      Argent's Inter-Covenant Communication does it, so far only in unaudited offline demos. The line that
      actually separates vProgs is shared mutable state. Where many users mutate one shared app state, L1
      composability tends to be exit-style rather than immediate at the moment a user acts.
    source: https://medium.com/@michaelsuttonil/kaspa-covenants-toccata-hard-fork-outlook-a4d81a40900c
    forbidden_copy:
      - cross-app atomic composition requires vProgs
      - Argent ICC demos are deployed on mainnet
  based_apps:
    status: targeted
    recheck_after: 2026-09-02
    summary: Based apps are the richer-state app lane around Kaspa L1 sequencing, commitments, proofs, settlement, or exits. They can start as deterministic replay over accepted transactions and add based-zk proof checks when verification is required. Direct L1 covenant examples such as vaults, escrow, and assurance do not require an L2.
    source: https://gist.github.com/michaelsutton/5bd9ab358f692ee4f54ce2842a0815d1
    forbidden_copy:
      - Kaspa apps require an L2
      - Based apps are live production Kaspa app rails
      - Every based app is a ZK app
      - A rollup PoC means vProgs are live
  zk_external_anchors:
    status: builder_guardrail
    recheck_after: 2026-09-08
    summary: ZK verification proves a statement about chosen public inputs; it does not by itself prove external-chain canonicality, prices, oracle events, or real-world facts. Bridge and oracle-style apps still need an agreed anchor such as a source-chain light client, finality certificate, accumulated-work view, oracle, reporter set, or challenge process.
    source: https://docs.kaspa.org/programmability
    forbidden_copy:
      - A ZK proof by itself proves what happened on another chain
      - OP_ZK_PRECOMPILE makes any external bridge trustless automatically
  vprogs_solana_like_experience:
    status: roadmap_framing
    recheck_after: 2026-09-11
    summary: Solana-like means a cohesive, Rust-friendly developer and user experience; it does not mean importing Solana execution or making L1 execute every app.
    source: https://www.youtube.com/live/GaJmYV8OHfQ
  native_defi:
    status: roadmap
    recheck_after: 2026-08-21
    summary: >
      Mature native Kaspa L1 DeFi still depends on future programmability foundations and app tooling, but
      the "nothing is deployed" version of this claim expired between July 25 and August 8, 2026. Measured
      August 14 via the kascov covenant indexer (kascov.io/data/mainnet-live.json), mainnet carries 27,725
      covenants ever created, 373 active, 27,352 burned, and about 1,674,423 KAS of total live covenant
      value, roughly 42,200 US dollars at kascov's quoted price. On August 8 the same figures were 27,166 /
      337 / 26,829 / 1,316,791.77 KAS: the fifteenfold July surge has slowed hard, up only about 2 percent
      in covenant count over the six days since. Testnet-10 carries 913,964 covenants and 74,199 active,
      about 33 times mainnet's covenant count, up from 29 times on August 8.
      Mainnet still carries 67 covenant token markets on bonding curves (kascov.io/data/mainnet/markets),
      but 6 have now graduated into AMM pools, up from 4 on August 8, with continuous trades; summed exit
      value across bonding-phase markets plus reserve value in graduated pools is about 1,531,750 KAS, up
      from about 515,418 KAS on August 8. This was verified past the indexer on August 8: trade txid
      dfca80761ffcebcb9b2f16984ea695fe542780ab9d836b061fb527e0277c708c read as accepted on api.kaspa.org
      with transaction version 1 and p2sh outputs whose amount matched kascov to the sompi; not re-verified
      txid by txid on August 14, since the indexer total itself was read fresh. So say markets exist and
      are still thin relative to the overall covenant total, rather than saying no market exists. Lending
      is still absent from mainnet. kascov's per-token/per-template breakdown (the 90-KCC20-token,
      4-escrow, p2sh-commitment split reported August 8) was not re-pulled this check; only the aggregate
      stats and market list were. kascov template labels are heuristic, so unrecognized apps could hide
      among the p2sh entries. Kaskad/Igra-style L2 lending can be described as ecosystem or L2 DeFi
      context, but it is not evidence that mature native Kaspa L1 DeFi, broad Toccata app usage, or vProgs
      are live. Do not describe the L1 path as Ethereum-style or EVM-compatible execution unless a primary
      source adds that support.
    source: https://kaspaexplained.com/why-kaspa-matters
    forbidden_copy:
      - Native DeFi is live
      - A mature live Kaspa-native app ecosystem already exists
      - Kaspa has live EVM-compatible L1 contracts
      - Kaskad proves native Kaspa L1 DeFi is live
      - Kaspa is waiting for Ethereum-style L1 smart contracts
      - Ethereum-style native app execution is planned on L1
      - live EVM-style L1 execution
      - No DEX, AMM, or lending market is deployed on mainnet
      - no DEX, no AMM, and no lending market on Kaspa mainnet
      - Almost nobody is using them in production yet
  dagknight:
    status: research
    recheck_after: 2026-08-31
    summary: >
      DAGKnight is the consensus upgrade that follows Toccata. Current mainnet behavior remains GHOSTDAG.
      Checked August 1, 2026 against kaspa.org/lore: the word parameterless does not appear on that page
      at all, and adaptive appears exactly once, inside "hashrate-adaptive finality windows" in the
      proposed 2027 section, so neither word can be sourced to that page as a DAGKnight descriptor. What
      the page does say is that DAGKnight is "the only 49% BFT partially synchronous protocol (in the
      oblivious setup)" with block times "targeted for the 40-25 millisecond range," and that DAGKnight
      "already provides safety under netsplits" while not providing progress during one. Sourcing for
      parameterless belongs to the DAGKnight paper, not kaspa.org. The rusty-kaspa dagknight branch is
      prototype evidence and has been dormant since March 22, 2026; the raw KIP-2 file still reads Status:
      Proposed. Activation needs release and network confirmation.
    source: https://kaspa.org/lore
    supporting_source: https://raw.githubusercontent.com/kaspanet/kips/master/kip-0002.md
    forbidden_copy:
      - DAGKnight is live
      - Kaspa has instant finality
  one_hundred_bps_partition_resilience:
    status: research
    recheck_after: 2026-09-07
    summary: Kaspa.org/lore places 10 millisecond blocks and 100 BPS work in a proposed 2027 hard-fork bucket, and describes the aim as on-chain payment channels plus hashrate-adaptive finality windows so local payment flows survive broken internet conditions. Use the page's own word, netsplit-resilient; the word partition does not appear on it. Treat all of this as roadmap/research until specifications, code, releases, and activation evidence exist.
    source: https://kaspa.org/lore
    forbidden_copy:
      - Kaspa is 100 BPS today
      - Partition-resilient payments are live
      - DAGKnight lets transactions confirm during a netsplit today
  official_roadmap_framing_lag:
    status: roadmap_framing
    recheck_after: 2026-08-28
    summary: >
      Kaspa.org's own Lore and Build pages lag mainnet activation. Checked August 14, 2026, 45
      days after Toccata activated on mainnet (June 30, 2026): Lore's Toccata section still opens
