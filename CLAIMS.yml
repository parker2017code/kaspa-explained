      covenant DEX that needs a shared price board. He compared the gap to Cardano's CIP-31
      reference inputs and CIP-32 inline datums, Ergo's data inputs, and CKB's cell deps, and asked
      whether closing it needs a new KIP or belongs in L2/vProgs. Six reactions, no reply as of
      August 22, 2026. This is a Telegram report. It has not appeared as a kas-smiths.org forum
      post, and it is not independently confirmed beyond being raised and left unanswered. Attempted
      recheck August 24, 2026: t.me/kasparnd's public preview is reachable, but Telegram group message
      content is not readable without an authenticated Telegram client or bot token, neither available
      this pass, so whether a reply has since landed could not be independently reverified. Set a short
      interval given this gap; the next pass should get real Telegram access or confirm no forum
      cross-post has appeared on kas-smiths.org instead.
    source: https://t.me/kasparnd
    forbidden_copy:
      - Kaspa covenants have a reference-input mechanism like Cardano or Ergo
      - the shared-state read gap has been answered with a KIP
