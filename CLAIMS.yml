  kcc_conventions:
    status: research_direction
    recheck_after: 2026-09-10
    summary: >
      Kaspa Calls for Conventions (KCCs) are an ecosystem-standards process, separate from KIPs.
      Five states must stay distinct here and never get blurred into each other: a number used
      only in a PR title, an open (unmerged) proposal, a merged checked-in draft, an accepted
      standard, and an activated protocol rule enforced by consensus. Nothing tracked below has
      reached the last two states. Confirmed August 22, 2026 via api.github.com/repos/kaspanet/kccs:
      created_at 2026-07-15T12:21:31Z, pushed_at 2026-08-20T23:18:28Z. Rechecked August 23, 2026
      directly against the issue pages (API rate-limited this pass): the repo took further pushes
      after that timestamp, an issue #11 close event August 22, 2026 and an issue #14 comment
      August 23, 2026, so pushed_at is later than 2026-08-20T23:18:28Z even though the exact new
      value was not re-pulled. The repo has been pushed to
      since creation; "not pushed to since July 15" is no longer true. Three KCC files are merged
      on main: kcc-0001.md (covenant definition and ABI), kcc-0002.md (authority schemes), and
      kcc-0020.md (fungible token covenant spec). Fetched raw from GitHub August 22, 2026, all
      three read "Status: Draft" in the document body: merged means checked into the repo as a
      draft. It does not mean adopted as a standard. KCC-0002 merged via PR #5, opened July 20, 2026 and merged
      August 20, 2026. KCC-0020 was last updated August 21, 2026; its authors are Sivan Helfer,
      Michael Sutton, and Romain Billot. KCC-0021 (covenant token metadata) is not merged: PR #6
      is open, opened July 23, 2026, still active August 21, 2026. Its body claims the convention
      "already live... runs in production in kascov" and "was adopted by KaspaRocket at deploy
      time"; that claim lives inside an open, unmerged proposal and could not be independently
      confirmed, so it is recorded here as an unverified claim inside an open proposal. It is not
      recorded as fact. KCC-0402 (covenant payment channels) is also not merged: PR #4 is open, and
      its body claims a k402 reference implementation "proven on Kaspa mainnet." That claim gets
      the same treatment: an unverified claim inside an open PR. It is not recorded as fact. Three
      attempts to land a bulk KCC-0008
      through KCC-0024 token/commerce set all closed unmerged: PR #7 (closed July 25, 2026), PR #8
      (closed July 25, 2026), and PR #10 (closed August 9, 2026); PR #9 (KCC-0016/0017) also
      closed unmerged, July 25, 2026. None of KCC-0003 through KCC-0024 exist as accepted
      standards; most exist only as numbers used in closed, unmerged PR titles. The README draws
      its own boundary: "KCCs do not propose changes to Kaspa consensus or core-node behavior.
      Such changes belong in Kaspa Improvement Proposals (KIPs)," and "Acceptance marks an
      ecosystem convergence point; it does not make the convention protocol ground truth." Repo
      numbering (four digits, KCC-0020) is canonical; forum shorthand like "KCC20" is not. The
      convention is already showing up in code ahead of acceptance: the Argent compiler ships an
      examples/icc/kcc20_asset.ag asset covenant. Community claims of KCC20 mainnet wallet
      transfers remain unverified. Read directly in the browser August 23, 2026, including the
      full comment thread on the issue page itself:
      KCC-0020 carries a permanent-supply-split consequence its co-authors partly defend and
      partly concede is a spec defect. Issue #14 (github.com/kaspanet/kccs/issues/14), opened
      August 21, 2026 by Knitser, still Open, now with 4 comments (was 3 as of the August 22
      check), shows the spec's transfer
      consolidation rule (Section 2) and its extended-state update entrypoint (Section 4)
      contradict each other: each holder's own UTXO can only be updated with that holder's
      authorization, so no single party, including the issuer, can move every cell to a new
      extended-state commitment at once, and because consolidation requires identical commitments
      across inputs, a partial update permanently splits a token's supply into groups that can
      never consolidate again. Manyfestation defended one pattern as intended, writing that
      extended state "allows for various use cases which are not only write-once, nor only for a
      singleton token," and gave a rock-paper-scissors token-type example. Michael Sutton agreed
      that pattern was fine, confirming with his own example, a stablecoin issuer's `frozen`
      blacklist flag, that it "indeed renders the token as temporarily non fungible." But Sutton
      then raised a different pattern, extended state used for ephemeral, receipt-like data that
      "mutates all the time but isn't part of the state that matters," and said "I think it means
      it's a wrong pattern," adding it "only makes sense if it was well defined as part of the
      std, and not as an opaque virtual state." Manyfestation agreed: "that kind of pattern should
      either be defined in the standard or implemented in a non state storage." That is a co-author
      concession that a distinct pattern is a spec defect, not a resolution of Knitser's original
      report: Knitser never replied to accept or withdraw his concern, and no spec change has
      merged. A fourth comment landed August 23, 2026 from ShawnPearce, agreeing with the
      fungibility framing but flagging a new problem with the fix path Sutton and Manyfestation
      floated (moving receipt-like data into the transaction payload instead of state): the payload
      is committed unconditionally by the v1 sighash, outside every sighash-type branch, so it is
      signature-bound and transaction-scoped rather than per-cell, and under this spec's borrowed
      receive a borrower who builds and signs the transaction controls the payload the owner's cell
      gets recreated with, meaning the borrower would be the one writing the "owner's" receipt data.
      ShawnPearce did not call the idea dead, only under-specified in the same way the extended-state
      pattern was. The site's own framing of this issue must reflect all five parts: the pattern
      defended as intended, the pattern conceded as wrong and needing a fix, the payload alternative's
      own new caveat, the reporter's unwithdrawn concern, and the issue's open status. Separately, issue #11
      (github.com/kaspanet/kccs/issues/11), opened July 26, 2026 by marciano147 writing for
      KaspaCom, was Closed (stateReason COMPLETED) by marciano147 on August 22, 2026, after
      Knitser commented August 15, 2026 that KCC-0021's metadata layer is deliberately
      behavior-independent, binds only to the covenant genesis payload and the covenant ID, and so
      any covenant token, KCC20V2 included, can adopt it at deploy time without byte-for-byte
      KCC-0020 conformance; tokens already deployed without a genesis payload can still be carried
      through a signed-list tier the latest PR #6 revision describes. The issue's closure does not
      retract KaspaCom's original position, which remains on record in the issue body: "The
      existing KCC20V2 artifact should be described as partially aligned, not fully
      conforming" with KCC-0001, 0002, 0020, and 0021. That is still the only production implementer of
      a KCC token standard on record disclaiming full conformance to it, in the implementer's own
      words; the closure reflects that KaspaCom's specific questions were answered, not that the
      conformance gap was closed. And kas-smiths.org topic 8 post 56 by 0xKnitser, August 15, 2026
      (kas-smiths.org/t/fungible-token-covenant-specification-kcc20/8/56), documents that one
      mainnet launchpad's 74 live tokens already span four separate template generations with no
      migration path between them, only opt-in burn and reissue. KCC-0020 carries a second open
      defect distinct from the supply-split bug: borrowed receive. Shawn, kas-smiths.org/t/8 post
      25, July 10, 2026: "borrowed receive lets anyone change your UTXO's outpoint, which griefs
      pre-signed, outpoint bound transactions... a stranger borrowing a token into it before the
      tx lands invalidates the order and forces a rebuild." Post 53, August 10, 2026, on why there
      is no signature-level fix: "The v1 sighash folds the spent input's own outpoint into the
      signed message unconditionally... AnyoneCanPay only zeroes the other inputs' outpoints,
      never the signed input's own." Authorization has to move to something outpoint-agnostic the
      covenant checks against its own state; nothing has merged. Separately, KCC-0021 stays an
      open, unmerged PR (kaspanet/kccs#6, opened July 23, 2026, still open August 22, 2026), and
      concrete evidence backs why a metadata standard matters: 0xKnitser, kas-smiths.org/t/98 post
      8, August 15, 2026, cross-checked one live launchpad's published logo URLs and found "5 of
      19 published logo URLs were dead within days and 3 more served HTML instead of an image."
      Rechecked August 24, 2026 directly against issue and PR pages: issue #14 is still Open with the same
      four participants (Knitser, Manyfestation, Sutton, ShawnPearce) and no fifth commenter or spec change;
      issue #11 is still Closed; PR #6 (KCC-0021) and PR #4 (KCC-0402) are still open, unmerged; the repo
      still carries exactly three merged KCC files on main (kcc-0001.md, kcc-0002.md, kcc-0020.md), no
      fourth has landed.
    source: https://github.com/kaspanet/kccs
    forbidden_copy:
      - KCC20 is a ratified Kaspa standard
      - KCC conventions change Kaspa consensus
      - the kccs repo has not been pushed to since it was created
      - KCC-0021 is a merged standard
      - KCC-0402 is a merged standard
      - kascov and KaspaRocket production use prove KCC-0021 is adopted
      - a k402 mainnet deployment proves KCC-0402 is adopted
      - merged KCC drafts are accepted standards
      - KCC-0020's extended state bug has been fixed
      - KCC-0020's co-authors disagree about whether the supply-split behavior is intended
      - co-authors call intended design behavior
      - co-authors call intended behavior
      - co-authors call it intended
      - describe as intended rather than a bug
      - treated this as intended behavior
      - treated as intended for extended-state tokens
      - open, unfixed correctness bug
      - open correctness gap
      - bug made tangible
      - KCC-0020's extended state bug is unresolved by design
      - Knitser withdrew his concern about KCC-0020
      - only the issuer can authorize a KCC-0020 state update
      - KaspaCom fully conforms to KCC-0020
      - KCC-0020 tokens on the mainnet launchpad share a single template
      - KCC-0020's borrowed-receive griefing has a signature-level fix
      - AnyoneCanPay protects a pre-signed transaction from borrowed receive
      - KCC-0021 is a merged metadata standard
      - "issue #11 is still open"
      - moving receipt-like data into the transaction payload has no downsides
      - the payload alternative for KCC-0020 extended state is a clean fix

