    source: https://kaspa.org/lore
    supporting_source: https://kaspa.org/build
    forbidden_copy:
      - Kaspa.org's own pages confirm Toccata mainnet activation
      - kaspa.org/lore and kaspa.org/build describe Toccata as mainnet-live
