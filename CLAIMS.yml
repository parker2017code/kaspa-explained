  toccata:
    status: daa_gated
    recheck_after: 2026-09-14
    summary: >
      Rusty Kaspa v2.0.1 was published on June 15, 2026 as the current Toccata release. Rusty Kaspa v2.0.0
      was published on June 5, 2026 as the Mainnet Toccata Release; it set Toccata mainnet activation for
      DAA score 474,165,565, roughly June 30, 2026 at 16:15 UTC, and says nodes switch peer compatibility
      behavior 24 hours before the activation score. Toccata activated. After the score, check
      upgraded-node behavior, transaction version 1 handling, covenant data, ZK proof paths, wallets,
      explorers, SDKs, examples, and accepted mainnet transactions. TN10/TN12 and KIP evidence remain
      useful testnet/design evidence. On July 15, 2026 the four Toccata KIPs (16, 17, 20, 21) were
      promoted together to Status: Active in kips commit e4ae2332, replacing their earlier TN10-scoped
      status. The promotion reflects the spec repo catching up to activation that already happened
      on mainnet; it did not itself change the protocol. Transaction
      version 1 and computeBudget run on mainnet and are documented in the operator guide, but their specs
      (KIP-24 PR #41 and KIP-25 PR #42) are still open, so cite the guide or the node rather than a merged
      KIP number. No rusty-kaspa release exists after v2.0.1 (June 15, 2026), which remains the
      current mainnet release. Six "Toccata Cleanup" PRs (#1082-#1084, #1086, #1087, #1089) merged
      August 19-21, 2026 removed the pre-Toccata conditional code paths entirely: peer negotiation
      now requires protocol version 10 unconditionally (a node rejects protocol 7/8/9 peers
      outright rather than accepting them until one day before activation), the mempool/consensus
      ForkedParam machinery keyed on toccata_activation is gone, and every forked parameter
      collapses to the value it already resolved to post-activation. This is cleanup of already-
      activated behavior: it does not itself activate anything new, and it has not yet shipped in
      a tagged release. Rechecked August 23, 2026: no change. v2.0.1 (June 15, 2026) remains the
      newest tagged release, and PRs #1082-#1084, #1086, #1087, and #1089 all still show merged
      (August 19-21, 2026) with no new Toccata Cleanup PRs opened since. Rechecked August 24, 2026:
      a seventh Toccata Cleanup PR appeared and merged same-day, #1101, "Toccata cleanup - P2P
      follow-ups" (michaelsutton, opened August 23, merged August 24, reviewed and approved by
      coderofstuff). It continues the same pattern as #1082-#1089: "correct stale post-Toccata
      consensus comments," remove the old protocol-version-7/8 flow registrations and consolidate
      P2P flows under version 10 only, remove body_only_ibd_permitted so the IBD client
      unconditionally requests block bodies, and drop the now-unused HeaderFormat/Versioned<T>
      plumbing in favor of applying the v10 compressed-parent header format uniformly. This is
      cleanup of already-activated P2P behavior, not new activation, and v2.0.1 (June 15, 2026) is
      still the newest tagged release; #1101 has not shipped in a tagged release either. Rechecked
      September 1, 2026 against the rusty-kaspa releases feed and the master commit feed: v2.0.1 is
      still the newest tagged release, and #1101 (August 24) is still the newest commit on master, so
      no eighth cleanup PR has landed.
    source: https://github.com/kaspanet/rusty-kaspa/releases/tag/v2.0.0
    supporting_source: https://github.com/kaspanet/rusty-kaspa/releases/tag/v2.0.1
    forbidden_copy:
      - Toccata is still pending
      - Toccata is scheduled to activate
      - Toccata will activate
      - Toccata is targeted
      - TN12 covenant evidence proves mainnet activation
      - TN10 activation proves mainnet activation
      - tn10-toc2 is a mainnet release
      - merged TN10 KIPs prove mainnet activation
