  kcc_conventions:
    checked_on: 2026-09-14
    status: research_direction
    recheck_after: 2026-09-21
    summary: >
      Kaspa Calls for Conventions (KCCs) are an ecosystem-standards process separate from KIPs.
      KCC-1, KCC-2, and KCC-20 are merged Draft documents. KCC-0's file header says Last Call while
      the repository index still says Draft; PR #25 proposes Final. None is an accepted standard.
      Different extension_commitment values define different fungibility classes for KCC-20's standard
      transfer. That transfer cannot consolidate unlike classes and preserves the commitment. A
      program-specific transition may change extended state according to that program's own rules.
      KCC-20 remains a Draft convention, not a consensus rule or an accepted interoperability standard.
      Seven open pull requests were observed on 2026-09-14: #4, #6, #20, #23, #24, #25, and #26.
      PR #16 merged on 27 August 2026 and made identical extension_commitment a condition of fungibility
      for the standard transfer. Issue #14 remains open; its reporter said the discussion cleared up the
      model and that neither proposed fix was right, shifting the remaining questions toward wording and
      indexer behavior. Keep merged Draft documents, accepted conventions, and consensus rules separate.
    source: https://github.com/kaspanet/kccs
    supporting_source: https://github.com/kaspanet/kccs/blob/main/kcc-0020.md
    supporting_source_2: https://github.com/kaspanet/kccs/issues/14#issuecomment-5385039279
    forbidden_copy:
      - KCC20 is a ratified Kaspa standard
      - KCC conventions change Kaspa consensus
      - the kccs repo has not been pushed to since it was created
      - KCC-0021 is a merged standard
      - KCC-0402 is a merged standard
      - kascov and KaspaRocket production use prove KCC-0021 is adopted
      - a k402 mainnet deployment proves KCC-0402 is adopted
      - merged KCC drafts are accepted standards
      - three KCC documents are merged
      - KaspaCom fully conforms to KCC-0020
      - KCC-0020 tokens on the mainnet launchpad share a single template
      - KCC-0020's borrowed-receive griefing has a signature-level fix
      - AnyoneCanPay protects a pre-signed transaction from borrowed receive
      - KCC-0021 is a merged metadata standard
      - "issue #11 is still open"
      - moving receipt-like data into the transaction payload has no downsides
      - the payload alternative for KCC-0020 extended state is a clean fix

