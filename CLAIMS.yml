    summary: >
      DAGKnight is the consensus upgrade that follows Toccata. Current mainnet behavior remains GHOSTDAG.
      The parameterless descriptor belongs to the DAGKnight paper itself, "The DAG KNIGHT Protocol: A
      Parameterless Generalization of Nakamoto Consensus" (Sompolinsky and Sutton, IACR ePrint 2022/1494):
      DAGKnight removes the hardcoded k parameter and adapts to observed network conditions instead of a
      fixed anticone bound. kaspa.org's marketing pages are not a source for this repo (see AGENTS.md);
      checked August 1, 2026, kaspa.org/lore did not even use the word parameterless. KIP-2 (raw file,
      Status: Proposed) matches the paper: no a priori hardcoded k, wallets should incorporate k into a
      local confirmation policy; the KIP index table on kaspanet/kips, checked August 23, 2026, still lists
      KIP-2 as the only Proposed entry with every other tracked KIP either Active, Draft, Implemented, or
      Rejected. The rusty-kaspa dagknight branch is prototype evidence, not dormant: checked August 23,
      2026, the branch was updated as recently as August 14, 2026, when a "dk-umc-proposed" branch merged
      in "[DK::UMC] Promote proposed to actual umc implementation," on top of August 13 commits ("[DK::UMC]
      Move baseline checks behind feature flag," "[DK::CZM] Atomic operations when filling zone data,"
      "[DK] Remove unnecessary locks in protocol level") and a run of Universal Merge Consensus and
      conflict-zone work through late July. This corrects an earlier version of this claim, which had
      the branch dormant since a March 22, 2026 commit; that was true as of the check that wrote it but
