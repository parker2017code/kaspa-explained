  tn10_rest_submit_drops_compute_budget:
    status: builder_guardrail
    recheck_after: 2026-09-14
    summary: >
      Rechecked August 24, 2026 directly against the live schema at api-tn10.kaspa.org/openapi.json:
      SubmitTxModel still carries only version, inputs, outputs, lockTime, and subnetworkId, and
      SubmitTxInput still carries only previousOutpoint, signatureScript, sequence, and sigOpCount.
      compute_budget is still absent from the submit path. The community REST API at api-tn10.kaspa.org silently drops compute_budget when submitting
      v1 transactions, so SilverScript covenant deployments fail with "script units exceeded the
      amount committed in the input: used=100000, limit=9999." Verified directly against the live
      schema at https://api-tn10.kaspa.org/openapi.json on August 22, 2026: SubmitTxModel carries
      only version, inputs, outputs, lockTime, and subnetworkId, and its per-input SubmitTxInput
      schema carries only previousOutpoint, signatureScript, sequence, and sigOpCount; neither has
      a compute_budget field. The node's own read-side schemas do model the field (BlockTxInputModel
      and TxInput both carry computeBudget/compute_budget), so the gap is specific to the submit
      path. Compute_budget is not missing as a concept: it's modeled in the node's read-side
      schemas already, just absent from this one endpoint. Reported by daniel, kas-smiths.org/t/108 post 1, July 24, 2026,
      23:08:04 UTC: "the compute_budget field is silently dropped in the REST to RPC mapping."
      IzioDev's only workaround, post 2, July 29, 2026, 12:01:34 UTC: submit directly to a kaspad
      node instead of the REST API. Still open as of August 22, 2026. Rechecked September 1, 2026
      against the live schema: SubmitTxModel still carries only inputs, lockTime, outputs, subnetworkId
      and version, SubmitTxInput still carries only previousOutpoint, sequence, sigOpCount and
      signatureScript, and compute budget still appears only in the read-side schemas
      (BlockTxInputModel, BlockTxVerboseDataModel, TxInput, TxMass).
    source: https://api-tn10.kaspa.org/openapi.json
    forbidden_copy:
