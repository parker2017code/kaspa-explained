    source: https://github.com/kaspanet/rusty-kaspa/releases/tag/tn10-toc3
    forbidden_copy:
      - TN10 activation proves mainnet activation
      - Testnet-10 Toccata means mainnet Toccata is live
      - tn10-toc2 is a mainnet release
      - tn10-toc3 is a mainnet release
      - TN10 passed the activation score, so Toccata is live on mainnet
  tn12_covenant_evidence:
    status: testnet_only
    recheck_after: 2026-09-10
    summary: >
      Rechecked August 24, 2026: the parker2017code/tn12-covenant-vault-demo repo this claim cites is still
      reachable and unchanged; this is a fixed evidence set from a completed testnet lab run, not a live
      feed, so it is not expected to move. The TN12 covenant lab has accepted proof transactions for vault recovery,
      vault delayed withdrawal, assurance release/refund, escrow release/refund/cancel,
      role-separated positive paths (all 7), batch-assurance 3-pledge release, and
      40 payload events, including scheduler-intent, scheduler-bid, scheduler-execution, and scheduler-covenant-binding receipts, plus accepted playground role-wallet funding, two user-to-pool deposits, and one pool-to-user payout. The public results and playground pages explain the evidence and role flow without upgrading it into mainnet or production custody. Adversarial rejection evidence covers 13 cases across 5 mutation
      types (wrong-signer, wrong-selector, wrong-output-lock, wrong-output-amount,
      single-party-cancel) confirmed rejected by the TN12 node with script-level errors.
      All evidence is limited to TN12/Toccata lane testing. Mainnet status needs separate mainnet evidence.
    source: https://github.com/parker2017code/tn12-covenant-vault-demo
    forbidden_copy:
      - TN12 proofs mean covenants are live on mainnet
      - Adversarial rejections prove mainnet covenant enforcement
      - TN12 txids are mainnet txids
  vprogs:
    status: roadmap
    recheck_after: 2026-09-07
    summary: >
      vProgs are roadmap architecture for apps that prove richer logic while sharing Kaspa ordering,
      including later cross-app atomic composition. They are not a mature live app ecosystem. The public
      vprogs repo README opens with "This repository is in early development / prototype phase. APIs and
      architecture may change significantly," and the workspace carries core, storage, state, scheduling,
      transaction-runtime, node, l1, zk, sim, runner, and examples members. Checked August 24, 2026: no
      change since the August 23, August 14, or August 7 checks before it. Still 19 commits landed in July
      2026, the last on July 28 adding a program-agnostic daemon engine and a vprun CLI. Nothing has landed
      since; the branch has now gone almost four weeks with no commits, and there are still zero releases,
      zero tags, and nothing on crates.io. Do not call the work pre-testnet.
      examples/tn10-flow describes itself as "a proof-of-concept that runs the L2 flow against a remote
      testnet-10 fork node," which is a custom fork node rather than the public Testnet-10, and settlement
      against the real OP_ZK_PRECOMPILE needs GPU proving rather than the dev stub receipts the default
      path emits. Its README says based computation while the GitHub description field says provable
      computation.
    source: https://github.com/kaspanet/vprogs
    forbidden_copy:
      - vProgs are live
  argent:
    status: research
    recheck_after: 2026-08-31
    summary: >
      Argent is an actor-based language and compiler for stateful multi-contract applications on
      covenant-native UTXO rails, compiling .ag source to plain Silverscript contracts and portable
      artifacts consumed by argent-runtime. The README's Project status section has two halves, and
      quoting only the first one misdescribes the project. The caution reads "The project is still under
      active development and is not yet release-ready," a careful early-production path opens only "Once
      Silverscript completes its audit and is released," and Argent itself "will still need further audit
      and hardening before general production use." The half that gets dropped reads "The main pieces are
      present: compiler, generated Silverscript, portable artifacts, runtime transaction building,
      multi-actor routing, cross-app linking, constrained covenant spawning, actor enums, closed and open
      ICC, and virtual-slot state expansion." A separate Current status section lists what is useful today
      (compiling .ag apps to auditable .sil, building tracked example transactions through argent-runtime,
      closed and open ICC examples, route-family and actor-enum examples, virtual-slot expanded state)
      apart from what is still being built (launch and bootstrap tooling, package and dependency tooling,
      diagnostics and typechecking, generated app-specific builder APIs, hardening and negative-test
      coverage). What remains is the audit path: Silverscript's audit, then Argent's own. The
      compiler itself already exists and is not what's missing. Checked August 23, 2026: the README's
      Project status text is unchanged, but the repo is not quiet. It went quiet after its August 2 commit
      for two weeks, then resumed: the latest push is August 17, 2026, "Sync Argent with latest Silverscript
      master (#46)," bringing the compiler's generated output in line with Silverscript's own August
      changes. This corrects an earlier version of this claim, which read the repo as having gone quiet
      since August 2; that was true as of the check that wrote it but is no longer current.
      The project has its own argent-lang organization, and github.com/michaelsutton/argent returns HTTP
      301 to github.com/argent-lang/argent. Three repos, all ISC licensed: argent (created June 16, now 80
      commits, up from 78 on August 23 and 77 on August 14; the per-author breakdown was not rerun at the
      new count, but Sutton held 73 of the prior 77, with a19q3, Manyfestation, and WolfieOC holding the
      other four), argent-playground (created July 9, multi-actor and DEX demos, last checked latest July
      29), and argent-template (created July 24, last checked latest July 29; both playground and template
      repos were not rechecked for new pushes this pass). Zero releases and zero tags on every repo.
      Rechecked August 24, 2026: two more commits landed August 23, PR #47 ("Sync hashing and entry
      dispatch with latest Silverscript") and PR #48 ("support temporal values across Argent"), both
      continuing the same pattern as the August 17 sync commit, tracking Silverscript's own churn rather
      than adding new unrelated surface area. The audit gate is independently visible upstream:
      kaspanet/silverscript also has zero releases and zero tags (confirmed again August 24, releases/latest
      still redirects to the empty releases page), and stayed active through the check window: still
      "Experimental," still recommending testnet-10-only use ahead of a first stable v1, with commits as
      recent as August 24, 2026, so the release Argent waits on still has not happened. The template's Scope
      section says it "does not
      connect to a Kaspa network, manage a wallet, or submit transactions," and its VS Code extension for
      .ag files is linked out of the Argent checkout rather than shipped by the template. An
      examples/icc/kcc20_asset.ag file prototypes a KCC-0020-style transferable asset covenant whose owner
      identifier can be a pubkey or a covenant ID.
    source: https://raw.githubusercontent.com/argent-lang/argent/master/README.md
    supporting_source: https://github.com/argent-lang/argent
    forbidden_copy:
      - Argent proves production Kaspa smart contracts are ready
      - Argent applications run on Kaspa mainnet
      - unfinished prototype
      - Argent has no transaction builder
      - Argent's compiler is incomplete

  cross_app_composition:
    status: roadmap
    recheck_after: 2026-09-07
    summary: >
      Atomic composition means several app states succeed or fail as one operation. Composing separately
      compiled covenant apps atomically inside a single transaction is possible on Toccata itself:
      Argent's Inter-Covenant Communication does it, so far only in unaudited offline demos. The line that
      actually separates vProgs is shared mutable state. Where many users mutate one shared app state, L1
      composability tends to be exit-style rather than immediate at the moment a user acts. Rechecked August 24, 2026
      against the Argent README and Sutton's based-apps gist: ICC composes separately compiled covenant apps
      inside one transaction, in unaudited offline demos only, and both repos still carry zero releases and
      zero tags.
    source: https://raw.githubusercontent.com/argent-lang/argent/master/README.md
    supporting_source: https://gist.github.com/michaelsutton/5bd9ab358f692ee4f54ce2842a0815d1
    forbidden_copy:
      - cross-app atomic composition requires vProgs
      - Argent ICC demos are deployed on mainnet
  based_apps:
    status: targeted
    recheck_after: 2026-09-09
    summary: >
      Based apps are the richer-state app lane around Kaspa L1 sequencing, commitments, proofs, settlement,
      or exits. They can start as deterministic replay over accepted transactions and add based-zk proof
      checks when verification is required. Direct L1 covenant examples such as vaults, escrow, and
      assurance do not require an L2. Rechecked August 24, 2026: the source gist is still reachable and
      still reads as R&D roadmap architecture, not a shipped product; no mainnet based-app evidence found.
    source: https://gist.github.com/michaelsutton/5bd9ab358f692ee4f54ce2842a0815d1
    forbidden_copy:
      - Kaspa apps require an L2
      - Based apps are live production Kaspa app rails
      - Every based app is a ZK app
      - A rollup PoC means vProgs are live
  zk_external_anchors:
    status: builder_guardrail
    recheck_after: 2026-09-08
    summary: ZK verification proves a statement about chosen public inputs; it does not by itself prove external-chain canonicality, prices, oracle events, or real-world facts. Bridge and oracle-style apps still need an agreed anchor such as a source-chain light client, finality certificate, accumulated-work view, oracle, reporter set, or challenge process.
    source: https://docs.kaspa.org/programmability
    forbidden_copy:
      - A ZK proof by itself proves what happened on another chain
      - OP_ZK_PRECOMPILE makes any external bridge trustless automatically
  vprogs_solana_like_experience:
    status: roadmap_framing
    recheck_after: 2026-09-11
    summary: Solana-like means a cohesive, Rust-friendly developer and user experience; it does not mean importing Solana execution or making L1 execute every app.
    source: https://www.youtube.com/live/GaJmYV8OHfQ
  native_defi:
    status: roadmap
    recheck_after: 2026-08-31
    summary: >
      Mature native Kaspa L1 DeFi still depends on future programmability foundations and app tooling, but
      the "nothing is deployed" version of this claim expired between July 25 and August 8, 2026. Measured
      fresh August 24, 2026 via the kascov covenant indexer (kascov.io/data/mainnet-live.json), mainnet
      carries 28,125 covenants ever created, 519 active, 27,606 burned, and 153,072,124,592,616 sompi of
      live covenant value, about 1,530,721 KAS. That is a real move worth flagging: covenant counts barely
      shifted from the August 22 read (28,107 -> 28,125 created, +18; 517 -> 519 active, +2; 27,590 ->
      27,606 burned, +16) but the live-value figure dropped about 12.5 percent, from about 1,750,093 KAS to
      about 1,530,721 KAS, in two days. Counts and value are decoupling: more covenants exist and more stay
      alive, but the KAS actually locked in them fell. This pass did not re-derive the reserve-sompi
      cross-check that fixed the unit as sompi on August 22 (summing priced bonding/graduated market
      entries independently); markets_total from kascov.io/data/mainnet/markets is still 93 entries as of
      August 24, unchanged from August 22, so the market count itself has not moved even though covenant
      value has. Measured August 22 via the same indexer, mainnet carried 28,107
      covenants ever created, 517 active, 27,590 burned, and 175,009,316,300,216 sompi of live covenant
      value, which is about 1,750,093 KAS. The August 21 read gave the same 28,107 / 517 / 27,590 counts
      against about 1,714,200 KAS of live value; only the value field moved. The prior reads were
      27,725 / 373 / 27,352 / 1,674,423 KAS on August 14 and
