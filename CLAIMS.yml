      merged September 21; the README index now agrees. KCC-1 (PR #32) and KCC-2 (PR #33) moved to Last
      Call on October 1, and PR #34 corrected the KCC-0 index. KCC-20 remains Draft; PR #31 proposes Last
      Call and remains open. Metadata KCC-21 PR
      #6 closed unmerged September 25; KCC-20 conformance PR #20 closed unmerged September 27; KCC-2 ECDSA
      PR #23 also closed unmerged. KCC-402 PR #4 remains open. The seven open PRs at this check are #4,
      #24, #26, #29, #31, #35 (mobile wallet session API), #36 (Covenant v2 draft). Standard KCC-20 transfers still preserve extension_commitment and cannot
      consolidate unlike fungibility classes. Issue #14 remains open. Project implementation claims do not
