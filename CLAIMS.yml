  l1_status_snapshot_2026_08_20:
    status: measurement_sensitive
    recheck_after: 2026-08-31
    summary: >
      An August 24, 2026 L1 status check (via api.kaspa.org/info/blockdag, /info/blockreward, and
      /info/coinsupply) showed virtual DAA score 521,476,468 (above the Toccata activation score and still
      inside the 504,909,000-531,207,000 emission step), a 2.31246515 KAS block reward matching that step,
      and about 27.659 billion KAS from the public supply endpoint (2,765,882,916,490,627,112 sompi). Max
      supply read 2,870,403,560,500,000,000 sompi, about 28.704 billion KAS. Supersedes the August 20, 2026
      reading: DAA 517,984,766 and about 27.651 billion KAS, same node version, same reward; the ~7.8
      million KAS gained over 4 days matches the block-reward math (2.31246515 KAS/block * 864,000
      blocks/day at 10 BPS is about 1,997,970 KAS/day). Supersedes the August 8, 2026 reading in turn: DAA
      507,631,731 and about 27.627 billion KAS, same node version, same reward. These are time-stamped
      network readings. They are unsuitable as timeless constants. Do not quote blockCount or headerCount
      from this endpoint: it load-balances across backend nodes with different pruning states, two reads a
      minute apart on August 8 returned 1,488,846 and 26,573,222, the August 20 read returned 1,116,061,
      below both, and the August 24 read returned 1,149,564, inside neither the August 8 nor the August 20
      range, further evidence this field is not a stable network-wide count.
    source: https://api.kaspa.org/info/blockdag
    forbidden_copy:
      - August 8 snapshot values are permanent
      - August 20 snapshot values are permanent
      - api.kaspa.org blockCount is a network-wide block total
      - A public REST API reading is stronger than node or release evidence
  emission_schedule_may_2026:
    status: live_design
    summary: >
      Kaspa's emission steps down every 2,629,800 seconds by a factor of 2^(-1/12), about 5.61% per step,
      426 steps deep in the consensus SUBSIDY_BY_MONTH_TABLE. Steps are triggered by DAA score, which is
      exact; calendar dates drift and should be marked approximate. Triggers and rates verified against
      coinbase.rs table indexes 48 through 52, which are 26,298,000 DAA apart at 10 BPS: 27.5 KAS/sec at
      DAA 426,015,000; 25.95654359 at 452,313,000; 24.49971474 at 478,611,000; 23.12465141 at 504,909,000,
      which the network passed around August 5, 2026 and which is current as of August 8, 2026;
      21.82676446 at 531,207,000, roughly September 4, 2026. At 10 BPS the current per-block subsidy is
      2.31246515 KAS, matching the block reward API. No month is a cliff.
    source: https://wiki.kaspa.org/en/tokenomics
    forbidden_copy:
      - Kaspa has a July 2026 emission cliff
      - July 2026 suddenly stops Kaspa issuance
      - the emission rate is 24.49971475 KAS per second
      - the current emission rate is 24.49971474 KAS per second
      - emission steps are anchored to calendar dates rather than DAA score
  tps_and_speed_context:
    status: measurement_sensitive
    recheck_after: 2026-09-07
    summary: >
      TPS, throughput, and speed claims need measurement context. Current simple-payment capacity can be
      described as a rough 2.5k-3.4k TPS range at 10 BPS under transaction-shape assumptions. Covenant apps,
      ZK proof settlements, tokens, and future vProg-style app throughput need separate workload labels
      before repeating a number as normal mainnet behavior. Rechecked August 24, 2026 directly against
      params.rs and mass/mod.rs: BPS is still 10 (TenBps), block_mass_limits.compute is still 500,000,
      mass_per_tx_byte is still 1, and mass_per_script_pub_key_byte is still 10, the exact inputs the
      2.5k-3.4k range is derived from. Nothing in that math moved. The kaspa-tps-explained.html URL this
      claim used to cite is now a redirect stub (its content was folded into what-is-kaspa.html on the
      2026-08-24 rewrite pass); the 2.5k-3.4k figure and the "Ask TPS of what?" breakdown both still render
      on what-is-kaspa.html, unchanged. site_context updated to point at the live page instead of the
      redirect.
    source: https://github.com/kaspanet/rusty-kaspa/blob/master/consensus/core/src/config/params.rs
    supporting_source: https://github.com/kaspanet/rusty-kaspa/blob/master/consensus/core/src/mass/mod.rs
    site_context: https://kaspaexplained.com/what-is-kaspa
    forbidden_copy:
      - testnet TPS is mainnet TPS
      - lab TPS is normal mainnet use
      - real-time means instant irreversibility
      - Kaspa currently does 30k TPS
      - Toccata doubles TPS
      - ZK makes TPS unlimited
  base_rtd:
    status: live_framing
    summary: >
      Hashdag (Yonatan Sompolinsky) frames real-time decentralization as Kaspa's core value
      proposition in his own words: "Kaspa is real-time bitcoin, solving scalability is great
      but not the core value prop... decentralizing each consensus round rather than chain
      quality achieved through a coarse aggregate of rounds." Treat RTD as Hashdag's own framing
      of the design goal. Citing it as a kaspa.org marketing claim would misrepresent the source:
      this comes directly from the researcher who coined the term.
    source: https://x.com/hashdag/status/2026991442506256843
  fair_launch_origin:
    status: narrative_guardrail
    summary: >
      Kaspa's fair-launch origin should be described as source-backed history: PHANTOM/GHOSTDAG research,
      DAGLabs-era commercialization attempts, Polychain/Accomplice-era VC funding, an April 2021 testnet,
      failed hardware/presale paths, a messy gamenet-to-mainnet path, and a November 2021 proof-of-work
      launch with no premine, insider allocation, or pre-sales. The Kaspa Wiki prehistory page estimates
      the post-launch DAGLabs/Polychain-related early-miner amount at under 3% of supply, 840 million KAS,
      with its longer note saying probably closer to 2.5% and under 850 million KAS. Use this as an
      early-miner estimate. Premine claims and exact official allocation tables need different evidence.
      Fair launch lowers official allocation risk; it does not mean no early core contributors mined, and
      it does not prove perfect distribution, adoption, price, or future execution.
    source: https://kaspaexplained.com/kaspa-origin-story
    forbidden_copy:
      - DAGLabs and Polychain had a premine
      - Polychain background is irrelevant to Kaspa's launch story
      - Fair launch means no early insiders mined
      - Fair launch proves perfect distribution
  original_kaspad_codebase:
    status: narrative_guardrail
    summary: The safest public wording for the original implementation is that Kaspad was written in Golang and described by Yonatan Sompolinsky's Hashdag archive as an adaptation of the Bitcoin client btcd. Do not state a specific Bitcoin Core version unless a stronger source is added.
    source: https://hashd.ag/raw
  adoption_strategy:
    status: narrative_guardrail
    summary: Fast money and Base of Liquidity language are thesis framing. An adoption plan needs products, users, liquidity, integrations, and repeated behavior. Generic merchant/POS payments should not be treated as the whole 2026 adoption vector; evaluate useful products, visible on-chain activity, liquidity, coordination-market direction, and durable app usage.
    source: https://x.com/DailyKaspa/status/2052716697262374936
    forbidden_copy:
      - Base of Liquidity is Kaspa's adoption plan
      - Generic merchant payments are Kaspa's killer app
      - Fast payments alone prove adoption
  coordination_markets:
