  base_rtd:
    status: live_framing
    summary: >
      Hashdag (Yonatan Sompolinsky) frames real-time decentralization as Kaspa's core value
      proposition in his own words: "Kaspa is real-time bitcoin, solving scalability is great
      but not the core value prop... decentralizing each consensus round rather than chain
      quality achieved through a coarse aggregate of rounds." Treat RTD as Hashdag's own framing
      of the design goal. Citing it as a kaspa.org marketing claim would misrepresent the source:
      this comes directly from the researcher who coined the term.
    source: https://x.com/hashdag/status/2026991442506256843
  fair_launch_origin:
    status: narrative_guardrail
    summary: >
      Kaspa's fair-launch origin should be described as source-backed history: PHANTOM/GHOSTDAG research,
      DAGLabs-era commercialization attempts, Polychain/Accomplice-era VC funding, an April 2021 testnet,
      failed hardware/presale paths, a messy gamenet-to-mainnet path, and a November 2021 proof-of-work
      launch with no premine, insider allocation, or pre-sales. The Kaspa Wiki prehistory page estimates
      the post-launch DAGLabs/Polychain-related early-miner amount at under 3% of supply, 840 million KAS,
      with its longer note saying probably closer to 2.5% and under 850 million KAS. Use this as an
      early-miner estimate. Premine claims and exact official allocation tables need different evidence.
      Fair launch lowers official allocation risk; it does not mean no early core contributors mined, and
      it does not prove perfect distribution, adoption, price, or future execution.
    source: https://kaspaexplained.com/kaspa-origin-story
    forbidden_copy:
      - DAGLabs and Polychain had a premine
