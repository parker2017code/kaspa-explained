      surge is well and truly over. Active covenants are the exception and rose 39 percent in the same
      week, from 373 to 517, which is a different signal from creation volume and worth watching
      separately: more of what exists is being kept alive rather than burned.
      The markets endpoint (kascov.io/data/mainnet/markets) returns 93 entries on August 22, but seven
      are LP-share tokens duplicating the market_id and covenant_id of a graduated pool already counted,
