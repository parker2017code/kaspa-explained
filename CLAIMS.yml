      Current KIP-17 introspection reads fields of the spending transaction and its spent input UTXOs;
      KIP-20 adds covenant-ID and authorized-output context for that same transaction. Neither specifies a
      non-consuming reference input for arbitrary unrelated live UTXO state. This is the boundary of
      direct L1 script introspection. External proofs and oracle inputs are different designs. The prior
      Telegram discussion and whether it received a reply were not reverified.
