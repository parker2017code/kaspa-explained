    source: https://www.youtube.com/live/GaJmYV8OHfQ
  rtd_derived_systems:
    status: research
    recheck_after: 2026-09-09
    summary: RTD-derived oracle, TangVM, miner attestation, and coordination-market flows are downstream research or architecture ideas.
    source: https://hashd.ag/raw
    forbidden_copy:
      - TangVM is live
      - Kaspa oracle flows are live
  kcc_conventions:
    status: research_direction
    recheck_after: 2026-08-23
    summary: >
      Kaspa Calls for Conventions (KCCs) are an ecosystem-standards process, separate from KIPs.
      The kaspanet/kccs repo was created on July 15, 2026 and has not been pushed to since that
      day: the repository root still contains no file other than README.md, and the standards
      index table inside it is empty. Exactly one pull request has merged, the README itself.
      Checked August 14, 2026: five specification pull requests are open and none is merged:
      KCC-0020 fungible token covenant spec, KCC-0001 covenant definition and ABI, KCC-0402
      covenant payment channels, KCC-0002 control principal references, and KCC-0021 covenant
      token metadata. Two proposals seen open on August 7, a bulk KCC-0008 through KCC-0024 token
      and commerce set and a KCC-0025 license agreement, were both withdrawn August 9 by their
      author, who wrote "Superseded by revised proposals under KCC-0060 and subsequent numbers."
      No KCC-0060-numbered pull request has been opened yet. The README draws the boundary itself:
      "KCCs do not propose changes to Kaspa consensus or core-node behavior. Such changes belong in
      Kaspa Improvement Proposals (KIPs)," and "Acceptance marks an ecosystem convergence point; it
      does not make the convention protocol ground truth." Repo numbering (four digits, KCC-0020)
      is canonical; forum shorthand like "KCC20" is not. The convention is already showing up in
      code ahead of acceptance: the Argent compiler ships an examples/icc/kcc20_asset.ag asset
      covenant. Related community claims of KCC20 mainnet wallet transfers are unverified.
    source: https://github.com/kaspanet/kccs
    forbidden_copy:
      - KCC20 is a ratified Kaspa standard
      - KCC conventions change Kaspa consensus

  covenant_tooling_and_support:
    status: builder_guardrail
    recheck_after: 2026-08-17
    summary: >
      Post-activation tooling is moving faster than the protocol. kaspa-python-sdk v2.0.2.rc1 was
      published July 23, 2026 as a prerelease; its release notes say only "Release candidate for
      2.0.2" and do not confirm SilverScript bindings. kascov is an active third-party covenant
      indexer and dashboard covering mainnet and testnet-10. Its README names the current gap
      plainly: there is no "get UTXOs by covenant ID" RPC, and block explorers do not decode
      covenant data yet. A covenant-ID RPC is described on the forum as planned, with no code and
      no version. Wallet support for constructing covenant transactions is UNVERIFIED; no
      KasWare, Kaspium, or KSPR covenant-signing release was found. Do not cite THTProtocol/Covex,
      which does not resolve.
    source: https://github.com/kaspanet/kaspa-python-sdk/releases
    forbidden_copy:
      - Kaspa wallets support covenant construction
      - block explorers decode covenant data
      - a covenant-ID RPC exists
