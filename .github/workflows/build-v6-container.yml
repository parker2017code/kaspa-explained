name: Build V6 container

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: v6-container-${{ github.sha }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/parker2017code/kaspa-explained-v6
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  image:
    if: github.repository == 'parker2017code/kaspa-explained'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out the exact dispatched commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check build inputs
        run: node scripts/check-v6-image-inputs.mjs

      - name: Set up Linux builder
        uses: docker/setup-buildx-action@v3

      - name: Verify native VM, proof, and service fixtures
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.v6
          target: verify
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=v6-linux-amd64
          cache-to: type=gha,scope=v6-linux-amd64,mode=max

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the checked runtime image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.v6
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=v6-linux-amd64
          cache-to: type=gha,scope=v6-linux-amd64,mode=max

      - name: Record the immutable image reference
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          REVISION: ${{ github.sha }}
        run: |
          test -n "$DIGEST"
          printf '### V6 image built and verified\n\nCommit: `%s`\n\nTag: `%s:%s`\n\nDeploy by digest: `%s@%s`\n\nNo hosting deployment was performed.\n' "$REVISION" "$IMAGE" "$REVISION" "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
