name: Site checks

on:
  push:
  pull_request:
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright Chromium
        run: npx --yes playwright@1.49.0 install --with-deps chromium

      - name: Run static site checks
        run: bash scripts/check-site.sh

      - name: Serve the site
        run: |
          python3 scripts/serve-local.py --port 4187 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4187/ >/dev/null && break; sleep 1; done

      - name: Rendered layout audit
        run: npx --yes --package playwright@1.49.0 node scripts/audit-rendered-layout.mjs
