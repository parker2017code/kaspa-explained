name: Verify education artifact
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run check:v1
      - name: Verify educational behavior
        run: node --test tests/models.test.mjs tests/network-diagram.test.mjs tests/money-models.test.mjs tests/coordination.test.mjs
      - run: npm run check:copy
      - run: npm run check:journeys
      - run: npm run check:render
      # Public hosting is Cloudflare. Keep this verified build as an artifact.
      - uses: actions/upload-artifact@v4
        with:
          name: deploy-verified
          path: dist-v1
          retention-days: 7
