name: Publish testnet applications
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run setup:testnet
      - name: Check out pinned contract VM source
        uses: actions/checkout@v6
        with:
          repository: kaspanet/silverscript
          ref: c7d17a15ac88610d013ec9ffffa9520aeb69929b
          path: .cache/upstream/silverscript
          persist-credentials: false
      - name: Install verified Rust toolchain
        run: rustup toolchain install 1.97.0 --profile minimal && rustup default 1.97.0
      - run: node scripts/build-public-templates.mjs --check-vm
      - run: node scripts/public-token-fixtures.mjs --check-vm
      - run: node scripts/public-receipt-fixtures.mjs --check-vm
      - run: npm run check
      - run: npm run check:public
      - run: npm run check:faucet
      - run: npm run check:public:browser
      - run: npm run check:copy
      - run: npm run check:posts
      - run: npm run check:v1
      - run: npm run check:guided
      - run: npm run check:journeys
      - run: KASPA_RELEASE=v2 npm run check:render
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy verified static artifact
        id: deployment
        uses: actions/deploy-pages@v4
